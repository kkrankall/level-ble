dump_gatt:
  fields:
    address:
      required: false
      example: "AA:BB:CC:DD:EE:FF"
      selector:
        text:
handshake:
  fields:
    address:
      required: false
      example: "AA:BB:CC:DD:EE:FF"
      selector:
        text:
    duration:
      required: false
      default: 10
      selector:
        number:
          min: 1
          max: 60
          unit_of_measurement: s
    protocol:
      required: false
      default: bixby
      selector:
        select:
          options:
            - bixby
            - skyline
